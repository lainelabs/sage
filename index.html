<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sage Wellness Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Sage: warm cream canvas, muted sage accent, charcoal text. Layout: sidebar (desktop) / bottom bar (mobile), card grid of today-first information. */
  --bg:#F8F5EF; --surface:#FFFFFF; --soft:#F2EEE6; --line:#EAE4D9;
  --ink:#2D312E; --ink2:#5C615C; --muted:#8B8F89;
  --sage:#7E9A7F; --sage-d:#5D7A61; --sage-l:#E7EEE4; --sage-xl:#F1F5EF;
  --beige:#EDE5D7; --sand:#D6C3A1; --clay:#C59A82; --mist:#9AABB6; --rose:#D4A5A0;
  --warn:#C7925A; --good:#6E9475;
  --f-display:"Manrope","DM Sans",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(60,55,40,.04),0 6px 20px rgba(60,55,40,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink2)} .small{font-size:13px} .xs{font-size:12px}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.sm{width:16px;height:16px}

/* ---------- shell ---------- */
.app{display:flex;min-height:100%}
.side{width:236px;flex:none;padding:28px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
.brand .mark{width:34px;height:34px;border-radius:11px;background:var(--sage-l);display:grid;place-items:center;color:var(--sage-d)}
.brand b{font-family:var(--f-display);font-size:18px;letter-spacing:-.02em}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink2);text-decoration:none;font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--sage-l);color:var(--sage-d)}
.side .foot{margin-top:auto;padding:10px 12px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--sand)}
.sync.ok i{background:var(--sage)} .sync.warn i{background:var(--warn)}
main{flex:1;min-width:0;padding:32px 36px 60px;max-width:1180px}
.bottom{display:none}
.top-sync{display:none}

@media (max-width:860px){
  .side{display:none}
  main{padding:20px 16px calc(96px + env(safe-area-inset-bottom))}
  .bottom{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);text-decoration:none;padding:5px 0;border-radius:10px}
  .bottom a.on{color:var(--sage-d)}
  .bottom a.on .icon{stroke-width:2}
  .top-sync{display:flex}
  h1{font-size:23px}
}

/* ---------- layout ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head .sub{color:var(--muted);margin-top:4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.dash{grid-template-columns:1.25fr 1fr}
@media (max-width:1020px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.g2,.g3,.dash{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;border:1px solid rgba(234,228,217,.6)}
.card.flat{box-shadow:none;background:var(--soft);border-color:transparent}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h2{font-size:16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.divider{height:1px;background:var(--line);margin:14px 0}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:12px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--sage-d);border-color:var(--sage-d);color:#fff}
.btn.pri:hover{background:#536f57}
.btn.soft{background:var(--sage-l);border-color:transparent;color:var(--sage-d)}
.btn.soft:hover{background:#dce6d8}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.icon-only{padding:8px;border-radius:10px}
.btn.danger{color:#A0574B}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--ink2);white-space:nowrap}
.chip.sage{background:var(--sage-l);color:var(--sage-d)}
.chip.sand{background:#F4ECDD;color:#8A6E3F}
.chip.clay{background:#F5E8E1;color:#9A6A50}
.chip.mist{background:#E8EEF1;color:#55707F}
.chip.rose{background:#F6E9E7;color:#9A5F58}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 11px;font-size:14.5px;min-width:0}
.input:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-l)}
textarea.input{resize:vertical;min-height:70px}
.input.sm{padding:6px 8px;font-size:13.5px;border-radius:9px}
.form{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.check{width:24px;height:24px;border-radius:8px;border:1.6px solid #CFC8BA;background:var(--surface);display:grid;place-items:center;flex:none;padding:0;transition:all .15s}
.check.on{background:var(--sage);border-color:var(--sage);color:#fff}
.check .icon{width:15px;height:15px;stroke-width:2.4}
.check.round{border-radius:50%}

/* ---------- progress ---------- */
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--sage);border-radius:99px;transition:width .4s}
.bar.sand > i{background:var(--sand)} .bar.clay > i{background:var(--clay)} .bar.mist > i{background:var(--mist)}
.macro{display:grid;gap:6px}
.macro .row{font-size:13.5px}
.ring-wrap{position:relative;width:150px;height:150px;flex:none}
.ring-wrap .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-wrap .big{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1}
.ring circle{transition:stroke-dashoffset .5s}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:22px;font-weight:700}
.stat span{font-size:12.5px;color:var(--muted)}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px;border:1.5px dashed var(--line);border-radius:var(--r-sm)}

/* meals */
.art{border-radius:14px;display:grid;place-items:center;flex:none;overflow:hidden;position:relative}
.art img{width:100%;height:100%;object-fit:cover}
.art svg{width:58%;height:58%}
.meal{display:flex;gap:14px;align-items:flex-start}
.meal .art{width:76px;height:76px}
.meal-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(234,228,217,.6);overflow:hidden;display:flex;flex-direction:column}
.meal-card .art{width:100%;height:120px;border-radius:0}
.meal-card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.slot-label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--sage-d)}
.kv{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.kv b{color:var(--ink);font-weight:700}
.ing{font-size:13.5px;color:var(--ink2);display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:4px}
.daytabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.daytab{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0;min-width:58px;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:600}
.daytab small{font-size:11px;color:var(--muted);font-weight:500}
.daytab.on{background:var(--sage-d);border-color:var(--sage-d);color:#fff}
.daytab.on small{color:#DCE6DA}
.daytab.today:not(.on){border-color:var(--sage)}

/* habits */
.glasses{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:30px;height:38px;border:0;background:none;padding:0;color:#C9D5DB}
.glass.on{color:var(--mist)}
.glass svg{width:100%;height:100%}
.habit{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.habit .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--ink2);flex:none}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--surface);width:30px;height:30px;font-size:16px;color:var(--ink2)}
.stepper input{width:64px;border:0;text-align:center;height:30px;font-size:14px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.stepper input:focus{outline:none;background:var(--sage-xl)}

/* calendar */
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal-col{background:var(--surface);border-radius:14px;border:1px solid var(--line);min-height:300px;padding:8px;display:flex;flex-direction:column;gap:6px;transition:background .15s}
.cal-col.drop{background:var(--sage-xl);border-color:var(--sage)}
.cal-col.today{border-color:var(--sage)}
.cal-col .dh{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px 6px;border:0;background:none;width:100%;text-align:left}
.cal-col .dh b{font-family:var(--f-display);font-size:18px}
.cal-col.today .dh b{color:var(--sage-d)}
.ev{border-radius:10px;padding:7px 8px;font-size:12.5px;line-height:1.3;cursor:grab;border:0;text-align:left;width:100%;display:flex;flex-direction:column;gap:1px}
.ev small{opacity:.75;font-size:11.5px}
.ev.workout{background:var(--sage-l);color:var(--sage-d)}
.ev.cardio{background:#EEF3EA;color:#5F7A5E}
.ev.recovery{background:#EEF3EA;color:#5F7A5E}
.ev.optional{background:#F3F1E9;color:#6E6A58}
.ev.rest{background:var(--soft);color:var(--muted)}
.ev.grocery{background:#F4ECDD;color:#82683B}
.ev.prep{background:#F5E8E1;color:#94654C}
.ev.weigh{background:#E8EEF1;color:#4F6B7A}
.ev.school{background:#F1EFEC;color:#77736C}
.ev.custom{background:#F6E9E7;color:#93605A}
.ev.dragging{opacity:.4}
.cal-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-month .wd{font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:4px}
.mcell{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:84px;padding:7px;display:flex;flex-direction:column;gap:4px;text-align:left;transition:background .15s}
.mcell.out{opacity:.45}
.mcell.today{border-color:var(--sage)}
.mcell.sel{background:var(--sage-xl);border-color:var(--sage)}
.mcell.drop{background:var(--sage-xl)}
.mcell .d{font-weight:700;font-size:13px}
.mcell .dots{display:flex;gap:3px;flex-wrap:wrap}
.mcell .dot{width:7px;height:7px;border-radius:50%}
.mcell .lbl{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){
  .cal-week{grid-template-columns:minmax(0,1fr);gap:8px}
  .cal-col{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .cal-col .dh{width:64px;flex-direction:column;align-items:flex-start;padding:4px}
  .cal-col .evs{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .mcell{min-height:56px;padding:5px}
  .mcell .lbl{display:none}
}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* grocery */
.gitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.gitem:last-child{border-bottom:0}
.gitem.done .gname{text-decoration:line-through;color:var(--muted)}
.gitem .gq{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2)}
.gitem input.input.sm{width:68px;text-align:right}
.gitem .price{display:flex;align-items:center;gap:2px;font-size:13.5px}
.gitem .price input{width:70px}
@media (max-width:560px){
  .gitem{grid-template-columns:auto minmax(0,1fr) auto}
  .gitem .gq{grid-column:2/3}
  .gitem .price{grid-column:3/4;grid-row:1/3;flex-direction:column;align-items:flex-end}
}

/* gym */
.wday{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);width:100%;text-align:left;transition:border-color .15s,background .15s}
.wday:hover{border-color:#D7D0C2}
.wday.on{border-color:var(--sage);background:var(--sage-xl)}
.wday .dn{width:42px;font-weight:700;font-family:var(--f-display)}
.exrow{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.sets{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:center;font-size:13px}
.sets .h{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.sets input{text-align:center}
.timer{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.timer b{font-family:var(--f-display);font-size:24px;min-width:62px}
.timer .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
@media (min-width:861px){.timer{bottom:28px}}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-size:11px;fill:var(--muted);font-family:var(--f-body)}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(40,40,35,.28);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s ease}
.sheet{background:var(--surface);border-radius:22px;width:100%;max-width:560px;max-height:min(86vh,820px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.18);animation:pop .18s ease}
.sheet.wide{max-width:760px}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;z-index:2;border-bottom:1px solid transparent}
.sheet-b{padding:4px 20px 22px;display:flex;flex-direction:column;gap:14px}
.sheet-f{position:sticky;bottom:0;background:var(--surface);padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
@media (max-width:860px){
  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:22px 22px 0 0;max-height:90vh;animation:up .22s ease;padding-bottom:env(safe-area-inset-bottom)}
}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:fade .2s}
.results{display:flex;flex-direction:column;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:14px}
.result{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.result:last-child{border-bottom:0}
.result:hover{background:var(--sage-xl)}
.note{display:flex;gap:10px;align-items:flex-start;background:#F7F1E6;color:#7A6542;border-radius:12px;padding:10px 12px;font-size:13px}
.note.sage{background:var(--sage-xl);color:var(--sage-d)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photo{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:var(--soft)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:11.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.5))}
.photo button{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.85);border:0;border-radius:8px;padding:4px;display:grid;place-items:center}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
.table td{padding:9px 8px;border-bottom:1px solid var(--line)}
.table tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}
.hide-m{} @media (max-width:860px){.hide-m{display:none!important}}
.show-m{display:none} @media (max-width:860px){.show-m{display:initial}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- auth & setup ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth-side{background:var(--sage-l);padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.auth-copy h1{font-size:34px;line-height:1.15;max-width:15ch;color:#33463A}
.auth-copy ul{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-direction:column;gap:12px;color:#4A5D4F}
.auth-copy li{display:flex;gap:10px;align-items:flex-start}
.auth-copy li .icon{color:var(--sage-d);margin-top:2px}
.auth-main{display:grid;place-items:center;padding:40px 20px}
.auth-card{width:100%;max-width:400px}
.auth-title{font-size:24px}
.linkbtn{border:0;background:none;padding:0;color:var(--sage-d);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.err{color:#A0574B;font-size:13.5px;margin:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--sage-l);color:var(--sage-d);display:inline-grid;place-items:center;font-weight:700;flex:none;font-family:var(--f-display)}
.avatar.sm{width:22px;height:22px;font-size:11px}
.pick{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--surface);font-weight:600;font-size:14px;color:var(--ink2)}
.pick.on{border-color:var(--sage);background:var(--sage-xl);color:var(--sage-d)}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);text-align:left;width:100%;font-size:14.5px}
.opt .radio{width:18px;height:18px;border-radius:50%;border:1.6px solid #CFC8BA;flex:none}
.opt.on{border-color:var(--sage);background:var(--sage-xl)}
.opt.on .radio{border:5px solid var(--sage)}
.setup{min-height:100%;display:flex;justify-content:center;padding:32px 16px 60px}
.setup-card{width:100%;max-width:620px}
.steps-dots{display:flex;gap:6px;margin-bottom:16px}
.steps-dots i{height:4px;flex:1;border-radius:4px;background:var(--line)}
.steps-dots i.on{background:var(--sage)}
@media (max-width:860px){
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-side{padding:24px 20px;gap:14px;justify-content:flex-start}
  .auth-copy h1{font-size:22px;max-width:none}
  .auth-copy ul,.auth-foot{display:none}
  .auth-main{place-items:start center;padding:24px 16px}
}

const SLOTS = [['brunch','Brunch'],['snack','Afternoon snack'],['dinner','Dinner']];
const SLOT_NAME = {brunch:'Brunch', snack:'Snack', dinner:'Dinner', other:'Other'};
const UNIT_NAME = {g:'g', cup:'cup', tbsp:'tbsp', pc:'pc'};

function food(id) { return FOODS[id] || (S.meals.customFoods || {})[id]; }
function unitsOf(f) { return ['g', ...Object.keys(f.u || {})]; }
function unitLabel(f, unit) { return unit === 'pc' ? (f.pcName || 'piece') : UNIT_NAME[unit] || unit; }
function grams(f, qty, unit) { return unit === 'g' ? qty : qty * ((f.u || {})[unit] || 0); }
function nutG(f, g) { return {kcal: f.n[0] * g / 100, p: f.n[1] * g / 100, c: f.n[2] * g / 100, f: f.n[3] * g / 100}; }
function priceOf(f) { if (!f.pr) return null; const o = S.grocery.prices[f.id]; return [o != null ? o : f.pr[0], f.pr[1]]; }
function costG(f, g) { const p = priceOf(f); if (!p) return 0; const raw = f.raw || 1; return p[1] === 'kg' ? p[0] / 1000 * g * raw : p[0] * g / ((f.u || {}).pc || 1); }
const addN = (a, b, k = 1) => ({kcal: a.kcal + b.kcal * k, p: a.p + b.p * k, c: a.c + b.c * k, f: a.f + b.f * k});
const ZERO = () => ({kcal: 0, p: 0, c: 0, f: 0});
function mealById(id) { return S.meals.library[id]; }
function mealNut(m, x = 1) {
  let t = ZERO(); if (!m) return t;
  m.ing.forEach(([fid, q, u]) => { const f = food(fid); if (f) t = addN(t, nutG(f, grams(f, q, u)), x); });
  return t;
}
function mealCost(m, x = 1) { let c = 0; if (!m) return 0; m.ing.forEach(([fid, q, u]) => { const f = food(fid); if (f) c += costG(f, grams(f, q, u)) * x; }); return c; }
function planDay(d) { return S.meals.plan[d] || {}; }
function dayPlanNut(d) { let t = ZERO(), cost = 0; SLOTS.forEach(([s]) => { const p = planDay(d)[s]; if (p) { const m = mealById(p.id); t = addN(t, mealNut(m, p.x)); cost += mealCost(m, p.x); } }); return {...t, cost}; }

function logTotals(date) { return dayLog(date).reduce((t, e) => addN(t, e), ZERO()); }

function weeklyAvgs(list) {

function sessionOn(date) { return (S.wlog[monthKey(date)] || []).find(s => s.date === date); }

function resolveEx(id) {
  const e = EX[id]; if (!e) return {name: id, swapped: false, e: {cues: [], subs: [], eq: 'none'}};
  const b = branch(); const miss = (b && b.missing) || [];
  if (miss.includes(e.eq)) { const s = e.subs.find(([, eq]) => !miss.includes(eq)); if (s) return {name: s[0], swapped: true, orig: e.name, e}; }
  return {name: e.name, swapped: false, e};
}

function calcTargets(W) {
  const w = +W.weight, h = +W.height, a = +W.age || 25;
  const sexAdj = W.sex === 'male' ? 5 : W.sex === 'female' ? -161 : -78;
  const tdee = (10 * w + 6.25 * h - 5 * a + sexAdj) * ACT[W.activity].f;
  const lose = (+W.goal || w) < w;
  const floor = W.sex === 'male' ? 1500 : 1200;
  const kcal = Math.max(floor, Math.round((tdee - (lose ? PACES[W.pace][2] : 0)) / 50) * 50);
  const protein = Math.round(Math.min(+W.goal || w, w) * 1.6 / 5) * 5;
  const fat = Math.round(kcal * 0.3 / 9);
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  Object.assign(W, {kcal, protein, fat, carbs});
}
function addMin(t, m) { let [h, mm] = t.split(':').map(Number); const x = h * 60 + mm + m; return pad(Math.floor(x / 60) % 24) + ':' + pad(x % 60); }
function minsBetween(a, b) { const [h1, m1] = a.split(':').map(Number), [h2, m2] = b.split(':').map(Number); return Math.max(0, h2 * 60 + m2 - h1 * 60 - m1); }

function applySetup(s, W, isNew) {
  const P = s.profile, t = todayS(), kg = r1(+W.weight);
  Object.assign(P, {setupDone: true, setup: clone(W), name: W.name.trim(), sex: W.sex, age: +W.age || '', height: +W.height, goal: r1(+W.goal),
    kcal: +W.kcal, protein: +W.protein, carbs: +W.carbs, fat: +W.fat, water: +W.water, steps: +W.steps, sleep: +W.sleep,
    pace: paceLabel(W.pace), activity: ACT[W.activity].label, foods: PROTEINS.filter(p => W.foods.includes(p[0])).map(p => p[1]).join(', '),
    location: W.location.trim(), budgetMin: +W.budgetMin, budgetMax: +W.budgetMax, gym: W.gym.trim(),

  // weight
  const last = [...s.progress.weights].sort((a, b) => a.d < b.d ? -1 : 1).pop();
  if (isNew || !last) { P.startWeight = kg; P.startDate = t; }
  if (!last || last.kg !== kg) { s.progress.weights = s.progress.weights.filter(x => x.d !== t); s.progress.weights.push({id: uid(), d: t, kg}); }
  P.weight = kg;

  const ok = new Set(W.foods), lib = s.meals.library;
  const allowed = m => !MEAL_PROTEIN[m.id] || ok.has(MEAL_PROTEIN[m.id]);
  s.meals.plan.forEach((day, di) => SLOTS.forEach(([slot], si) => {
    const cur = day[slot]; if (!cur || !lib[cur.id] || allowed(lib[cur.id])) return;
    const alts = Object.values(lib).filter(m => (slot === 'snack' ? m.cat === 'snack' : m.cat !== 'snack') && allowed(m));
    if (alts.length) day[slot] = {id: alts[(di * 3 + si) % alts.length].id, x: 1};

  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);

function lineChart(w, h, o) {
  // o: {lines:[{pts:[[x,y]], color, width, fill, dots, dotR, opacity}], goal, xTicks:[[x,label]], yfmt}
  const P = {l: 36, r: 12, t: 14, b: 24};
  const all = o.lines.flatMap(l => l.pts);
  if (!all.length) return `<div class="empty">No entries yet</div>`;
  let xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  if (o.goal != null && o.showGoal) ys.push(o.goal);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 1; x1 += 1; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const padY = Math.max((y1 - y0) * 0.15, o.minSpan || 0.5); y0 -= padY; y1 += padY;
  const X = x => P.l + (x - x0) / (x1 - x0) * (w - P.l - P.r), Y = y => P.t + (1 - (y - y0) / (y1 - y0)) * (h - P.t - P.b);
  const step = niceStep((y1 - y0) / 4); const ticks = [];
  for (let v = Math.ceil(y0 / step) * step; v <= y1; v += step) ticks.push(v);
  let s = `<svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label || 'chart')}">`;
  ticks.forEach(v => { s += `<line x1="${P.l}" x2="${w - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l - 6}" y="${Y(v) + 4}" text-anchor="end">${(o.yfmt || (n => r1(n)))(v)}</text>`; });
  (o.xTicks || []).forEach(([x, lab]) => { s += `<text x="${X(x)}" y="${h - 6}" text-anchor="middle">${esc(lab)}</text>`; });
  if (o.goal != null && o.goal >= y0 && o.goal <= y1) s += `<line x1="${P.l}" x2="${w - P.r}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" stroke="var(--clay)" stroke-dasharray="4 4" stroke-width="1.3"/><text x="${w - P.r}" y="${Y(o.goal) - 5}" text-anchor="end" style="fill:var(--clay)">Goal ${o.goal}</text>`;
  o.lines.forEach(l => {
    const pts = l.pts;
    if (l.fill && pts.length > 1) s += `<path d="M${X(pts[0][0])},${h - P.b} ${pts.map(p => `L${X(p[0])},${Y(p[1])}`).join(' ')} L${X(pts[pts.length - 1][0])},${h - P.b}Z" fill="${l.color}" opacity=".10"/>`;
    if (l.width && pts.length > 1) s += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]) + ',' + Y(p[1])).join(' ')}" fill="none" stroke="${l.color}" stroke-width="${l.width}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (l.dots) pts.forEach((p, i) => { const last = i === pts.length - 1 && l.emphLast; s += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${last ? 5 : (l.dotR || 3)}" fill="${last ? l.color : (l.dotFill || l.color)}" stroke="${last ? '#fff' : 'none'}" stroke-width="2" opacity="${l.opacity || 1}"/>`; });
  });
  return s + '</svg>';
}

/* ================= FOOD LOG ================= */
function mealsLog() {
  const date = U.logDate, P = S.profile, tot = logTotals(date), log = dayLog(date), t = todayS();
  const groups = ['brunch', 'snack', 'dinner', 'other'].map(s => {
    const es = log.filter(e => (e.slot || 'other') === s); const k = es.reduce((a, e) => a + e.kcal, 0);
    if (!es.length && s === 'other') return '';
    return `<section class="card"><div class="card-h"><div><h2>${SLOT_NAME[s]}</h2><span class="xs muted num">${fmtN(k)} kcal</span></div>
      <div class="row" style="gap:4px">${es.length > 1 ? `<button class="btn ghost sm" data-a="saveCombo" data-s="${s}">${ic('star', 'sm')} Save</button>` : ''}<button class="btn soft sm" data-a="quickAdd" data-s="${s}">${ic('plus', 'sm')} Add</button></div></div>
      <div class="list">${es.map(e => `<div class="item"><div class="grow"><div class="t small">${esc(e.name)}</div><div class="xs muted num">${e.fid ? `${fmtQty(e.qty)} ${unitLabel(food(e.fid) || {}, e.unit)} · ` : e.mid ? `×${e.x} serving · ` : ''}${r0(e.p)} P · ${r0(e.c)} C · ${r0(e.f)} F</div></div>
        <span class="num small"><b>${fmtN(e.kcal)}</b></span><button class="btn ghost icon-only" data-a="editEntry" data-id="${e.id}" aria-label="Edit entry">${ic('edit', 'sm')}</button><button class="btn ghost icon-only" data-a="delEntry" data-id="${e.id}" aria-label="Delete entry">${ic('trash', 'sm')}</button></div>`).join('') || '<div class="empty" style="padding:14px">Nothing logged</div>'}</div></section>`;
  }).join('');
  return `<div class="row wrap between" style="margin-bottom:14px">
    <div class="row"><button class="btn icon-only" data-a="logNav" data-n="-1" aria-label="Previous day">${ic('left')}</button><div style="min-width:170px;text-align:center"><b>${date === t ? 'Today' : date === addDays(t, -1) ? 'Yesterday' : DAYS_L[dowOf(date)]}</b><div class="xs muted">${fmtDate(date, {day: 'numeric', month: 'long', year: 'numeric'})}</div></div><button class="btn icon-only" data-a="logNav" data-n="1" aria-label="Next day">${ic('right')}</button></div>
    <div class="row wrap" style="gap:6px"><button class="btn sm" data-a="copyPrev">${ic('copy', 'sm')} Copy previous day</button><button class="btn sm" data-a="logAllPlanned">${ic('list', 'sm')} Log planned meals</button><button class="btn pri sm" data-a="quickAdd">${ic('plus', 'sm')} Add food</button></div></div>
  <div class="grid dash">
    <div class="stack">${groups}</div>
    <div class="stack"><section class="card"><div class="card-h"><h2>Daily summary</h2></div>
      <div class="row" style="gap:18px;align-items:center;flex-wrap:wrap"><div class="ring-wrap" style="width:120px;height:120px">${ring(tot.kcal / P.kcal, 120, 11)}<div class="center"><span class="big num" style="font-size:22px">${fmtN(tot.kcal)}</span><span class="xs muted">of ${fmtN(P.kcal)}</span></div></div>
      <div class="grow stack" style="gap:12px;min-width:170px">${macroRow('Protein', tot.p, P.protein)}${macroRow('Carbs', tot.c, P.carbs, 'sand')}${macroRow('Fat', tot.f, P.fat, 'clay')}</div></div>
      <p class="xs muted" style="margin-top:14px">All values are estimates. Edit any entry if your portion was different.</p></section>
      ${weekKcalCard(date)}</div>
  </div>`;
}
function weekKcalCard(date) {
  const ws = weekStart(date), P = S.profile;
  const days = DAYS.map((n, i) => { const d = addDays(ws, i), k = logTotals(d).kcal; return {n, d, k}; });
  const max = Math.max(P.kcal * 1.15, ...days.map(x => x.k));
  return `<section class="card"><div class="card-h"><h2>This week</h2><span class="xs muted">target line ${fmtN(P.kcal)}</span></div>
    <div style="position:relative;height:120px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end">
      <div style="position:absolute;left:0;right:0;bottom:${P.kcal / max * 100}%;border-top:1.5px dashed var(--clay);opacity:.6"></div>
      ${days.map(x => `<button data-a="logDate" data-date="${x.d}" style="border:0;background:none;padding:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px" aria-label="${x.n} ${fmtN(x.k)} kcal"><span style="width:100%;max-width:26px;border-radius:7px 7px 3px 3px;height:${Math.max(2, x.k / max * 100)}%;background:${x.d === date ? 'var(--sage-d)' : 'var(--sage-l)'}"></span></button>`).join('')}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px">${days.map(x => `<span class="xs muted" style="text-align:center">${x.n}</span>`).join('')}</div></section>`;
}
A.logNav = d => { U.logDate = addDays(U.logDate, +d.n); render(); };
A.logDate = d => { U.logDate = d.date; render(); };
A.delEntry = d => { setDayLog(U.logDate, dayLog(U.logDate).filter(e => e.id !== d.id)); render(); };
A.copyPrev = () => {
  const prev = addDays(U.logDate, -1), src = dayLog(prev);
  if (!src.length) { toast('Nothing logged the day before'); return; }
  setDayLog(U.logDate, [...dayLog(U.logDate), ...src.map(e => ({...e, id: uid(), sample: undefined}))]);
  toast(`Copied ${src.length} items from ${fmtShort(prev)}`); render();
};
A.logAllPlanned = () => {
  const date = U.logDate, p = planDay(dowOf(date)), log = dayLog(date); let n = 0;
  const add = SLOTS.map(([s]) => { const m = p[s] && mealById(p[s].id); if (!m || log.some(e => e.mid === m.id && e.slot === s)) return null; n++; const nn = mealNut(m, p[s].x); return {id: uid(), slot: s, name: m.name, mid: m.id, x: p[s].x, kcal: r0(nn.kcal), p: r1(nn.p), c: r1(nn.c), f: r1(nn.f)}; }).filter(Boolean);
  if (!n) { toast('Planned meals are already logged'); return; }
  setDayLog(date, [...log, ...add]); toast(`Logged ${n} planned meal${n > 1 ? 's' : ''}`); render();
};
A.saveCombo = d => {
  const es = dayLog(U.logDate).filter(e => (e.slot || 'other') === d.s);
  U.combo = {name: es.map(e => e.name.split(',')[0]).slice(0, 3).join(' + '), items: es};

};
A.saveComboGo = () => {

/* quick add */
function defaultSlot() { const h = new Date().getHours(); return h < 14 ? 'brunch' : h < 18 ? 'snack' : 'dinner'; }
A.quickAdd = d => {
  const date = View.cur === 'meals' && U.mealTab === 'log' ? U.logDate : todayS();

function qaSheet() {
  const q = U.qa;
  const slotSeg = `<div class="seg">${[...SLOTS.map(([k]) => [k, SLOT_NAME[k]]), ['other', 'Other']].map(([k, l]) => `<button class="${q.slot === k ? 'on' : ''}" data-a="qaSlot" data-s="${k}">${l}</button>`).join('')}</div>`;
  const dateLbl = q.date === todayS() ? 'Today' : fmtDate(q.date, {weekday: 'short', day: 'numeric', month: 'short'});
  if (q.pick) return qaPickView(slotSeg, dateLbl);
  if (q.tab === 'manual') return `${sheetHead('Add food', dateLbl)}<div class="sheet-b">${slotSeg}
    <div class="seg"><button data-a="qaTab" data-t="search">Search</button><button class="on" data-a="qaTab" data-t="manual">Enter manually</button></div>
    <div class="form"><div class="field full"><label for="m-name">Food name</label><input class="input" id="m-name" placeholder="e.g. Puso + lechon manok" autofocus></div>
    <div class="field"><label for="m-kcal">Calories (kcal)</label><input class="input num" id="m-kcal" inputmode="numeric"></div>
    <div class="field"><label for="m-p">Protein (g)</label><input class="input num" id="m-p" inputmode="decimal"></div>
    <div class="field"><label for="m-c">Carbs (g)</label><input class="input num" id="m-c" inputmode="decimal"></div>
    <div class="field"><label for="m-f">Fat (g)</label><input class="input num" id="m-f" inputmode="decimal"></div>

    <div class="sheet-f"><button class="btn" data-a="closeSheet">Cancel</button><button class="btn pri" data-a="qaManualAdd">Add to log</button></div>`;
  return `${sheetHead('Add food', dateLbl)}<div class="sheet-b">${slotSeg}
    <div class="seg"><button class="on" data-a="qaTab" data-t="search">Search</button><button data-a="qaTab" data-t="manual">Enter manually</button></div>
    <div class="field"><label for="qa-q" class="sr">Search foods and meals</label><div style="position:relative"><span style="position:absolute;left:11px;top:10px;color:var(--muted)">${ic('search', 'sm')}</span><input class="input" style="padding-left:34px" id="qa-q" placeholder="Search chicken, rice, yogurt, adobo…" data-i="qaSearch" value="${esc(q.q)}" autocomplete="off" autofocus></div></div>
    <div id="qa-results">${qaResults(q.q)}</div></div>`;
}
function qaResults(q) {
  const res = (title, items) => items.length ? `<div class="eyebrow" style="margin:6px 0 6px">${title}</div><div class="results">${items.join('')}</div>` : '';
  const mealBtn = m => { const n = mealNut(m); return `<button class="result" data-a="qaPick" data-k="meal" data-id="${m.id}">${mealArt(m, '', 'width:38px;height:38px;border-radius:9px')}<div class="grow"><div class="small t">${esc(m.name)}</div><div class="xs muted num">${fmtN(n.kcal)} kcal · ${r0(n.p)} g P · 1 serving</div></div>${ic('plus', 'sm')}</button>`; };
  const foodBtn = f => `<button class="result" data-a="qaPick" data-k="food" data-id="${f.id}"><div class="grow"><div class="small t">${esc(f.name)}</div><div class="xs muted num">${f.custom ? `${r0(f.n[0])} kcal per serving` : `${f.n[0]} kcal · ${f.n[1]} g P per 100 g`}</div></div>${ic('plus', 'sm')}</button>`;
  if (!q) {
    const p = planDay(dowOf(U.qa.date));
    const planned = SLOTS.map(([s]) => p[s] && mealById(p[s].id)).filter(Boolean).map(mealBtn);
    const combos = S.meals.combos.map(c => `<button class="result" data-a="qaCombo" data-id="${c.id}"><div class="grow"><div class="small t">${esc(c.name)}</div><div class="xs muted num">${fmtN(c.items.reduce((a, e) => a + e.kcal, 0))} kcal · ${c.items.length} items</div></div>${ic('plus', 'sm')}</button>`);
    const seen = new Set(), recent = [];
    for (let i = 0; i < 14 && recent.length < 6; i++) dayLog(addDays(todayS(), -i)).slice().reverse().forEach(e => { if (recent.length < 6 && !seen.has(e.name)) { seen.add(e.name); recent.push(e); } });
    const rec = recent.map(e => `<button class="result" data-a="qaRecent" data-n="${esc(e.name)}"><div class="grow"><div class="small t">${esc(e.name)}</div><div class="xs muted num">${fmtN(e.kcal)} kcal · ${r0(e.p)} g P</div></div>${ic('plus', 'sm')}</button>`);
    return res('Planned for this day', planned) + res('Saved combos', combos) + res('Recent', rec);
  }
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  const meals = Object.values(S.meals.library).filter(m => toks.every(t => m.name.toLowerCase().includes(t))).slice(0, 5).map(mealBtn);
  const foods = searchFoods(q, 15).map(foodBtn);
  return (res('Meals', meals) + res('Foods', foods)) || `<div class="empty">No match for “${esc(q)}”. <button class="btn sm soft" data-a="qaTab" data-t="manual">Enter it manually</button></div>`;
}
I.qaSearch = v => { U.qa.q = v; $('#qa-results').innerHTML = qaResults(v); };

A.qaTab = d => { U.qa.tab = d.t; U.qa.pick = null; refreshSheet(); };

const GT = {strength: 'workout', cardio: 'cardio', recovery: 'recovery', optional: 'optional', rest: 'rest'};
const EV_COLOR = {workout: 'var(--sage)', cardio: '#A3BBA0', recovery: '#C2D1BC', optional: '#D5D0BE', rest: '#E2DCD0', grocery: 'var(--sand)', prep: 'var(--clay)', weigh: 'var(--mist)', school: '#CFCAC2', custom: 'var(--rose)'};

function eventsOn(date) {
  const d = dowOf(date), sk = S.cal.skip, out = [];
  const g = S.gym.days[d];
  if (g && !sk['wk|' + date]) out.push({key: 'wk|' + date, rid: 'wk', type: GT[g.type] || 'workout', title: g.name, time: g.type === 'rest' ? '' : g.time, dur: g.dur, ref: d, date, recurring: true});
  S.cal.recurring.forEach(r => { if (r.dow === d && !sk[r.id + '|' + date]) out.push({...r, key: r.id + '|' + date, rid: r.id, date, recurring: true}); });
  S.cal.events.forEach(e => { if (e.date === date) out.push({...e, key: 'ev|' + e.id, eid: e.id}); });
  return out.sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
}
function workoutFor(date) {
  const evs = eventsOn(date).filter(e => e.ref != null);
  const w = evs.find(e => e.type !== 'rest') || evs[0]; if (!w) return null;
  const day = S.gym.days[w.ref]; return day ? {day, ref: w.ref, time: w.time || day.time, ev: w} : null;
}
function findEvent(key) { const date = key.startsWith('ev|') ? (S.cal.events.find(e => e.id === key.slice(3)) || {}).date : key.split('|')[1]; return date ? eventsOn(date).find(e => e.key === key) : null; }
function moveEvent(key, newDate) {
  if (key.startsWith('ev|')) { const e = S.cal.events.find(x => x.id === key.slice(3)); if (e) e.date = newDate; }
  else { const date = key.split('|')[1]; if (date === newDate) return; const ev = findEvent(key); if (!ev) return; S.cal.skip[key] = true; S.cal.events.push({id: uid(), type: ev.type, title: ev.title, date: newDate, time: ev.time, dur: ev.dur, ref: ev.ref, note: ev.note}); }
  Store.mark('cal');
}

  tick(); U.timer.iv = setInterval(tick, 250);
}
function stopTimer() { if (U.timer) clearInterval(U.timer.iv); U.timer = null; const el = $('#timer'); if (el) el.remove(); }

}

/* ================= GROCERY ================= */
function ensureGroceryWeek() {
  const ws = weekStart(todayS());
  if (S.grocery.week !== ws) { S.grocery.week = ws; S.grocery.checked = {}; S.grocery.qty = {}; S.grocery.manual.forEach(m => m.checked = false); Store.mark('grocery'); }
}
function groceryItems() {
  const need = {};
  for (let d = 0; d < 7; d++) SLOTS.forEach(([s]) => { const p = planDay(d)[s], m = p && mealById(p.id); if (!m) return;
    m.ing.forEach(([fid, q, u]) => { const f = food(fid); if (!f || !f.pr) return; need[fid] = (need[fid] || 0) + grams(f, q, u) * p.x; }); });
  return Object.entries(need).map(([fid, g]) => {
    const f = food(fid), pr = priceOf(f); let qty, unit;
    if (pr[1] === 'pc') { unit = f.pcName || 'pc'; qty = Math.max(1, Math.ceil(g / f.u.pc - 0.15)); }
    else { unit = 'g'; const bg = g * (f.raw || 1); qty = f.cat === 'pantry' ? Math.max(10, Math.ceil(bg / 10) * 10) : Math.ceil(bg / 50) * 50; }
    const auto = qty; if (S.grocery.qty[fid] != null) qty = S.grocery.qty[fid];
    const cost = pr[1] === 'pc' ? qty * pr[0] : qty / 1000 * pr[0];
    return {fid, name: f.buyName || f.name.replace(/, raw$/, ''), cat: f.cat, qty, auto, unit, cost, price: pr[0], per: pr[1]};
  }).sort((a, b) => a.name.localeCompare(b.name));
}
VIEWS.grocery = () => {
  ensureGroceryWeek();
  const P = S.profile, items = groceryItems(), man = S.grocery.manual;

  const avg = total / 7, left = items.filter(x => !S.grocery.checked[x.fid]).length + man.filter(x => !x.checked).length, count = items.length + man.length;
  const status = avg < P.budgetMin ? ['sage', 'Under budget, with room for extras'] : avg <= P.budgetMax ? ['sage', 'Within your daily budget'] : ['clay', 'Above your daily budget'];
  const dayCosts = DAYS.map((n, i) => ({n, c: dayPlanNut(i).cost}));
  const maxC = Math.max(P.budgetMax * 1.1, ...dayCosts.map(x => x.c));
  const groups = GROCERY_CATS.map(([cat, label]) => {
    const its = items.filter(x => x.cat === cat), ms = man.filter(x => x.cat === cat);
    if (!its.length && !ms.length) return '';
    const sub = its.reduce((a, x) => a + x.cost, 0) + ms.reduce((a, x) => a + (+x.price || 0), 0);
    return `<section class="card"><div class="card-h"><h2>${label}</h2><span class="small muted num">${peso(sub)}</span></div><div class="list">
      ${its.map(x => { const on = !!S.grocery.checked[x.fid]; return `<div class="gitem ${on ? 'done' : ''}"><button class="check ${on ? 'on' : ''}" data-a="gCheck" data-id="${x.fid}" aria-label="Mark ${esc(x.name)} bought" aria-pressed="${on}">${ic('check')}</button>
        <div class="gname"><div class="small t">${esc(x.name)}</div>${x.cat === 'pantry' ? '<div class="xs muted">Amount used this week</div>' : ''}</div>
        <div class="gq"><input class="input sm num" id="gq-${x.fid}" inputmode="decimal" value="${x.qty}" data-c="gQty" data-id="${x.fid}" aria-label="Quantity of ${esc(x.name)}"><span>${x.unit === 'g' ? (x.qty >= 1000 ? `g · ${r1(x.qty / 1000)} kg` : 'g') : esc(x.unit) + (x.qty > 1 ? 's' : '')}</span></div>
        <div class="price"><span class="num"><b>${peso(x.cost)}</b></span><span class="xs muted row" style="gap:2px">₱<input class="input sm num" style="width:58px;padding:3px 5px" id="gp-${x.fid}" inputmode="decimal" value="${x.price}" data-c="gPrice" data-id="${x.fid}" aria-label="Price per ${x.per}">/${x.per === 'kg' ? 'kg' : esc(food(x.fid).pcName || 'pc')}</span></div></div>`; }).join('')}
      ${ms.map(x => `<div class="gitem ${x.checked ? 'done' : ''}"><button class="check ${x.checked ? 'on' : ''}" data-a="gManCheck" data-id="${x.id}" aria-label="Mark ${esc(x.name)} bought">${ic('check')}</button>
        <div class="gname"><div class="small t">${esc(x.name)}</div><div class="xs muted">Added by you</div></div><div class="gq">${esc(x.qty || '')}</div>
        <div class="price row" style="gap:4px"><span class="num"><b>${peso(+x.price || 0)}</b></span><button class="btn ghost icon-only" data-a="gManDel" data-id="${x.id}" aria-label="Remove">${ic('trash', 'sm')}</button></div></div>`).join('')}

        <div class="seg">${[['4', '4 wk'], ['12', '12 wk'], ['all', 'All']].map(([k, l]) => `<button class="${U.progRange === k ? 'on' : ''}" data-a="progRange" data-r="${k}">${l}</button>`).join('')}</div></div></div>

        <div class="note sage" style="margin-top:12px">${ic('info')}<span>${progressMessage()} Day-to-day weight can swing 0.5–1.5 kg from water, salt and hormones, so the weekly line is the one to watch.</span></div></section>

  return lineChart(w, 230, {label: 'Weight trend', goal: S.profile.goal, showGoal: U.showGoal, xTicks: xt, yfmt: n => r1(n),
    lines: [{pts: ws.map(x => [T(x.d), x.kg]), color: '#C9D3C6', dots: true, dotR: 3}, {pts: wa.map(x => [wkMid(x.d), x.kg]), color: 'var(--sage-d)', width: 2.5, fill: !U.showGoal, dots: true, emphLast: true, dotR: 3}]});

  } else {
    title = U.setupNew ? `You’re all set${W.name ? ', ' + esc(W.name) : ''}` : 'Ready to update your plan';
    sub = U.setupNew ? 'Here’s what we built for you. Everything can be edited later.' : 'Your logs and history stay as they are.';
    const lose = +W.goal < +W.weight;
    const rows = [
      ['flame', `${fmtN(W.kcal)} kcal and ${W.protein} g protein a day`],
      ['trend', lose ? `${r1(+W.weight - +W.goal)} kg to go, at a ${PACES[W.pace][0].toLowerCase()} pace` : 'Maintain your weight and build strength'],
      ['meals', `A 7-day meal plan with ${PROTEINS.filter(p => W.foods.includes(p[0])).map(p => p[1].toLowerCase()).join(', ')}`],
      ['gym', `5 gym sessions a week, ${PREF_TIMES[W.pref][1]}${W.busyDays.length ? `, later on ${W.busyDays.slice().sort().map(d => DAYS[d]).join('/')}` : ''}`],
      ['cart', `Grocery list for ${peso(W.budgetMin)}–${peso(W.budgetMax)} a day`],
    ];
    body = `<div class="list">${rows.map(([i, l]) => `<div class="item"><div class="habit" style="padding:0;border:0"><div class="ic" style="color:var(--sage-d);background:var(--sage-l)">${ic(i)}</div></div><span class="small">${l}</span></div>`).join('')}</div>`;
  }
  const isLast = st === STEPS.length - 1, firstStep = U.setupNew ? 0 : 1;
  el.innerHTML = `<div class="row between" style="margin-bottom:20px"><div class="brand" style="padding:0"><div class="mark">${ic('leaf')}</div><b>Sage</b></div>
      ${st > 0 && !isLast ? `<span class="xs muted">Step ${st} of ${STEPS.length - 2}</span>` : U.setupNew ? `<button class="linkbtn small" data-a="signOut">Sign out</button>` : `<button class="linkbtn small" data-a="wCancel">Cancel</button>`}</div>
    <div class="steps-dots" aria-hidden="true">${STEPS.slice(1, -1).map((_, i) => `<i class="${i < st ? 'on' : ''}"></i>`).join('')}</div>
    <div class="card" style="padding:26px"><h1 style="font-size:24px">${title}</h1><p class="muted" style="margin:6px 0 20px">${sub}</p>
      <form class="stack" style="gap:16px" data-f="wNext" novalidate>${body}
        ${err ? `<p class="err" role="alert">${esc(err)}</p>` : ''}
        <div class="row" style="gap:8px;margin-top:6px">${st > firstStep ? `<button type="button" class="btn" data-a="wBack">${ic('left', 'sm')} Back</button>` : ''}<span class="grow"></span>
          <button class="btn pri" style="padding:11px 20px">${st === 0 ? 'Let’s start' : isLast ? (U.setupNew ? 'Go to my dashboard' : 'Save changes') : 'Continue'} ${isLast ? '' : ic('right', 'sm')}</button></div></form></div>`;
  const f = el.querySelector('input'); if (f && window.innerWidth > 860 && !f.value) f.focus();
}
I.w = (v, d, el) => { U.W[d.k] = v; if (el.dataset.t) U.W.targetsTouched = true; else if (U.step < 3) U.W.targetsTouched = false; };
A.wSet = d => { U.W[d.k] = d.k === 'activity' ? +d.v : d.v; if (U.step < 3) U.W.targetsTouched = false; renderSetup(); };
A.wToggle = d => { const a = U.W.foods; U.W.foods = a.includes(d.v) ? a.filter(x => x !== d.v) : [...a, d.v]; renderSetup(); };
A.wDay = d => { const v = +d.v, a = U.W.busyDays; U.W.busyDays = a.includes(v) ? a.filter(x => x !== v) : [...a, v]; renderSetup(); };
A.wRecalc = () => { calcTargets(U.W); U.W.targetsTouched = false; renderSetup(); };
A.wBack = () => { U.step = Math.max(0, U.step - 1); renderSetup(); };
A.wCancel = () => startApp();
function setupError() {
  const W = U.W, n = k => parseFloat(W[k]);
  switch (U.step) {
    case 0: if (!W.name.trim()) return 'Add your name so we can greet you.'; break;
    case 1:
      if (!(n('age') >= 13 && n('age') <= 100)) return 'Enter your age (13 or older).';
      if (!(n('height') >= 120 && n('height') <= 230)) return 'Enter your height in centimetres, for example 162.5.';
      if (!(n('weight') >= 30 && n('weight') <= 300)) return 'Enter your current weight in kilograms.';
      if (!(n('goal') >= 30 && n('goal') <= 300)) return 'Enter a goal weight in kilograms.';
      if (n('goal') / Math.pow(n('height') / 100, 2) < 18.5) return `That goal is below a healthy weight for your height. Try ${Math.ceil(18.5 * Math.pow(n('height') / 100, 2))} kg or more.`;
      break;
    case 3:
      if (!(n('kcal') >= 1000 && n('kcal') <= 5000)) return 'Calories should be between 1,000 and 5,000.';
      if (!(n('protein') > 0)) return 'Enter a protein target.';
      break;
    case 4:
      if (!W.foods.length) return 'Pick at least one protein you eat.';
      if (!(n('budgetMin') > 0 && n('budgetMax') >= n('budgetMin'))) return 'Enter a daily budget range, for example ₱250 to ₱350.';
      break;
    case 5:
      if (W.busyDays.length && !(W.busyStart && W.busyEnd && W.busyEnd > W.busyStart)) return 'Check your start and end times.';
      break;
  }
  return '';
}
F.wNext = () => {
  const err = setupError(); if (err) return renderSetup(err);
  if (U.step === STEPS.length - 1) return finishSetup();
  U.step++;
  if (U.step === 3 && !U.W.targetsTouched) calcTargets(U.W);
  renderSetup(); window.scrollTo(0, 0);
};
function finishSetup() {
  const W = U.W; ['kcal', 'protein', 'carbs', 'fat', 'water', 'steps', 'sleep', 'budgetMin', 'budgetMax'].forEach(k => W[k] = parseFloat(W[k]) || 0);
  if (U.setupNew) { S = makeBase(); applySetup(S, W, true); }
  else applySetup(S, W, false);
  S = normalize(S); Store.mark(...allKeys());
  location.hash = 'home'; startApp();
  toast(U.setupNew ? `Welcome, ${S.profile.name}! Here’s your day.` : 'Your plan is updated');
}

/* ================= boot ================= */
function boot() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const fn = A[el.dataset.a]; if (!fn) return;
    e.preventDefault(); fn({...el.dataset}, el, e);
  });
  document.addEventListener('submit', e => { const f = e.target.closest('[data-f]'); if (f && F[f.dataset.f]) { e.preventDefault(); F[f.dataset.f](f); } });
  document.addEventListener('change', e => { const el = e.target.closest('[data-c]'); if (el && C[el.dataset.c]) C[el.dataset.c](el.value, {...el.dataset}, el); });
  document.addEventListener('input', e => { const el = e.target.closest('[data-i]'); if (el && I[el.dataset.i]) I[el.dataset.i](el.value, {...el.dataset}, el); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && Sheet.render) closeSheet(); });
  document.addEventListener('focusout', () => { if (pendingRender) setTimeout(() => { const a = document.activeElement; if (pendingRender && !(a && a.matches('input,textarea,select'))) { render(); if (Sheet.render) refreshSheet(); } }, 60); });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawCharts, 150); });
  window.addEventListener('hashchange', () => { if ($('#main') && S && S.profile.setupDone) route(); });
  let day = todayS(); setInterval(() => { if (todayS() !== day) { day = todayS(); U.logDate = day; U.mealDay = dowOf(day); if ($('#main')) safeRender(); } }, 60000);
  Auth.init();
}
boot();

</script>
